[package]
name = "lumiere_v1"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# WASM module artifact for `spacetime publish` / `cargo build --target wasm32-unknown-unknown`.
# Native `cargo test` uses the cdylib artifact for unit tests; domain reducer tests run as
# in-module test reducers (see tests/harness/mod.rs) inside the SpacetimeDB runtime.
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.0.1" }
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
phonenumber = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

# Standalone workspace root so `cargo build --target wasm32-unknown-unknown` (used by
# `spacetime generate`) does not inherit the repo root workspace membership error.
[workspace]
