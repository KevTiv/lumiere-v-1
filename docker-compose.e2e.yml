# Acceptance overlay for the OrbStack dev stack.
#
# Points the Docker api-server and web at the dedicated e2e SpacetimeDB module
# (never the developer module), disables every dev bypass, and serves a
# production web build. Driven by `make e2e-docker`; do not start by hand:
#   docker compose --env-file .env.docker -f docker-compose.dev.yml \
#     -f docker-compose.e2e.yml up -d --force-recreate api-server web
#
# E2E_STDB_MODULE, E2E_STDB_TOKEN and STDB_CREDENTIAL_ENCRYPTION_KEY come from
# .tmp/e2e/env.sh (written by e2e-smoke-setup) via the calling shell.
services:
  api-server:
    environment:
      # Same as the native runner: skip dotenv files so nothing leaks in.
      LUMIERE_E2E: "1"
      STDB_MODULE: ${E2E_STDB_MODULE:-lumiere-v1-local-e2e}
      STDB_SERVER_TOKEN: ${E2E_STDB_TOKEN:?run through make e2e-docker}
      STDB_CREDENTIAL_ENCRYPTION_KEY: ${STDB_CREDENTIAL_ENCRYPTION_KEY:?run through make e2e-docker}
      # A mock org replaces browser credentials with the privileged token.
      DEV_MOCK_ORG_ID: ""
      # Dedicated database in the same Postgres; the dev `lumiere` database
      # keeps its own migration history (created by scripts/e2e-docker-stack.sh).
      PG_DATABASE: ${E2E_PG_DATABASE:-lumiere_e2e}
      CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001

  web:
    command: >
      sh -c "pnpm install --frozen-lockfile &&
      pnpm exec next build &&
      pnpm exec next start --hostname 0.0.0.0 --port 3000"
    environment:
      STDB_MODULE: ${E2E_STDB_MODULE:-lumiere-v1-local-e2e}
      NEXT_PUBLIC_STDB_MODULE: ${E2E_STDB_MODULE:-lumiere-v1-local-e2e}
      STDB_SERVER_TOKEN: ${E2E_STDB_TOKEN:?run through make e2e-docker}
      STDB_CREDENTIAL_ENCRYPTION_KEY: ${STDB_CREDENTIAL_ENCRYPTION_KEY:?run through make e2e-docker}
      DEV_MOCK_ORG_ID: ""
      NEXT_PUBLIC_DEV_ADMIN: "false"
      NEXT_PUBLIC_API_GATEWAY_URL: ""
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
    healthcheck:
      start_period: 600s

  # Projects the e2e module into the dedicated database so acceptance proves the
  # durable projection converges (started by scripts/e2e-docker-projection.sh).
  projection-worker:
    environment:
      STDB_MODULE: ${E2E_STDB_MODULE:-lumiere-v1-local-e2e}
      STDB_SERVER_TOKEN: ${E2E_STDB_TOKEN:?run through make e2e-docker}
      PG_DATABASE: ${E2E_PG_DATABASE:-lumiere_e2e}

  e2e-runner:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
      ssh:
        - default=${HOME}/.ssh/id_ed25519
    environment:
      CI: "true"
      E2E_WORKERS: ${E2E_WORKERS:-1}
      PLAYWRIGHT_BASE_URL: http://web:3000
      LUMIERE_API_SERVER_URL: http://api-server:8082
      STDB_SERVER_TOKEN: ${E2E_STDB_TOKEN:?run through make e2e-docker}
      STDB_CREDENTIAL_ENCRYPTION_KEY: ${STDB_CREDENTIAL_ENCRYPTION_KEY:?run through make e2e-docker}
      STDB_MODULE: ${E2E_STDB_MODULE:-lumiere-v1-local-e2e}
      NEXT_PUBLIC_STDB_MODULE: ${E2E_STDB_MODULE:-lumiere-v1-local-e2e}
      STDB_HOST: http://spacetimedb:3000
      NEXT_PUBLIC_STDB_HOST: http://spacetimedb:3000
      NEXT_PUBLIC_API_GATEWAY_URL: ""
    ipc: host
    volumes:
      - ./frontend/web/test-results:/workspace/frontend/web/test-results
      - ./frontend/web/playwright-report:/workspace/frontend/web/playwright-report
    depends_on:
      api-server:
        condition: service_healthy
      web:
        condition: service_healthy
