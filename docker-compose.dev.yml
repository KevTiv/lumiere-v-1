# Local development stack for OrbStack.
# Start with: docker compose --env-file .env.docker -f docker-compose.dev.yml up --build
name: lumiere-dev

services:
  spacetimedb:
    image: clockworklabs/spacetime:v2.0.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        chown -R 1000:1000 /data &&
        exec su -s /bin/sh spacetime -c
        "spacetime start --listen-addr 0.0.0.0:3000 --data-dir /data --non-interactive"
    ports:
      - "3000:3000"
    volumes:
      - spacetimedb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "spacetime server ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant-health
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "/bin/busybox",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:6333/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 2 >/dev/null",
        ]
      interval: 5s
      timeout: 4s
      retries: 10

  chromium-worker:
    build:
      context: ./chromium-worker
    environment:
      PORT: 8090
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20

  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: cargo watch -w ai-gateway -w crates -w Cargo.toml -x 'run -p ai-gateway'
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-ai_gateway=debug,tower_http=info}
      LUMIERE_AI_GATEWAY_INTERNAL_SECRET: ${LUMIERE_AI_GATEWAY_INTERNAL_SECRET:?set LUMIERE_AI_GATEWAY_INTERNAL_SECRET in .env.docker}
      QDRANT_URL: http://qdrant:6333
      STDB_HOST: http://spacetimedb:3000
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      STDB_TOKEN: ${STDB_TOKEN:?set STDB_TOKEN in .env.docker}
      AI_CERTIFICATION_STDB_TOKEN: ${AI_CERTIFICATION_STDB_TOKEN:-}
      AI_CERTIFICATION_RUNTIME_HASH: ${AI_CERTIFICATION_RUNTIME_HASH:-}
      AI_CERTIFICATION_POLL_SECS: ${AI_CERTIFICATION_POLL_SECS:-5}
      AI_CERTIFICATION_BATCH_SIZE: ${AI_CERTIFICATION_BATCH_SIZE:-10}
      AI_CERTIFICATION_TIMEOUT_SECS: ${AI_CERTIFICATION_TIMEOUT_SECS:-30}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2}
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - cargo-target:/cargo-target
    depends_on:
      spacetimedb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: cargo watch -w api-server -w crates -w Cargo.toml -x 'run -p api-server'
    environment:
      PORT: 8082
      RUST_LOG: ${RUST_LOG:-api_server=debug,tower_http=info}
      STDB_HOST: http://spacetimedb:3000
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN in .env.docker}
      AI_GATEWAY_URL: http://ai-gateway:8080
      LUMIERE_AI_GATEWAY_INTERNAL_SECRET: ${LUMIERE_AI_GATEWAY_INTERNAL_SECRET:?set LUMIERE_AI_GATEWAY_INTERNAL_SECRET in .env.docker}
      LUMIERE_REPORT_RENDERER_URL: http://chromium-worker:8090
      LUMIERE_REPORT_ARTIFACT_DIR: /var/lib/lumiere/owner-reports
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      DEV_MOCK_ORG_ID: ${DEV_MOCK_ORG_ID:-}
    ports:
      - "8082:8082"
    volumes:
      - .:/workspace
      - cargo-target:/cargo-target
      - owner-report-artifacts:/var/lib/lumiere/owner-reports
    depends_on:
      ai-gateway:
        condition: service_healthy
      chromium-worker:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/health/ready >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  owner-report-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: cargo watch -w api-server -w crates -w Cargo.toml -x 'run -p api-server --bin owner-report-worker'
    environment:
      STDB_HOST: http://spacetimedb:3000
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN in .env.docker}
      AI_GATEWAY_URL: http://ai-gateway:8080
      LUMIERE_REPORT_RENDERER_URL: http://chromium-worker:8090
      LUMIERE_REPORT_ARTIFACT_DIR: /var/lib/lumiere/owner-reports
      LUMIERE_OWNER_REPORT_WORKER_POLL_SECS: ${LUMIERE_OWNER_REPORT_WORKER_POLL_SECS:-5}
      LUMIERE_OWNER_REPORT_WORKER_NAME: ${LUMIERE_OWNER_REPORT_WORKER_NAME:-owner-report-worker-dev}
      LUMIERE_OWNER_REPORT_WORKER_PORT: 8091
    volumes:
      - .:/workspace
      - cargo-target:/cargo-target
      - owner-report-artifacts:/var/lib/lumiere/owner-reports
    depends_on:
      spacetimedb:
        condition: service_healthy
      chromium-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health/ready >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: cargo watch -w api-server -w crates -w Cargo.toml -x 'run -p api-server --bin workflow-worker'
    environment:
      STDB_HOST: http://spacetimedb:3000
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN in .env.docker}
      LUMIERE_WORKFLOW_WORKER_POLL_SECS: ${LUMIERE_WORKFLOW_WORKER_POLL_SECS:-5}
      LUMIERE_WORKFLOW_WORKER_NAME: ${LUMIERE_WORKFLOW_WORKER_NAME:-workflow-worker-dev}
      LUMIERE_WORKFLOW_WORKER_PORT: 8093
      LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ENABLED: ${LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ENABLED:-false}
      LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_COMPANY_IDS: ${LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_COMPANY_IDS:-}
      LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ACTION_KEYS: ${LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ACTION_KEYS:-}
      LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_URL: ${LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_URL:-}
      LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_TIMEOUT_MS: ${LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_TIMEOUT_MS:-10000}
    volumes:
      - .:/workspace
      - cargo-target:/cargo-target
    depends_on:
      spacetimedb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8093/health/ready >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter ./web dev --hostname 0.0.0.0 --port 3000"
    environment:
      # pnpm may need to replace the mounted workspace dependency directory.
      # Compose starts this command without a TTY, so allow that non-interactive cleanup.
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      LUMIERE_API_SERVER_URL: http://api-server:8082
      LUMIERE_AI_GATEWAY_URL: http://ai-gateway:8080
      LUMIERE_AI_GATEWAY_INTERNAL_SECRET: ${LUMIERE_AI_GATEWAY_INTERNAL_SECRET:?set LUMIERE_AI_GATEWAY_INTERNAL_SECRET in .env.docker}
      STDB_HOST: http://spacetimedb:3000
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN in .env.docker}
      NEXT_PUBLIC_STDB_HOST: http://localhost:3000
      NEXT_PUBLIC_STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      DEV_MOCK_ORG_ID: ${DEV_MOCK_ORG_ID:-}
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - web-node-modules:/workspace/frontend/node_modules
    depends_on:
      api-server:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 30s

  iot-gateway:
    profiles: ["iot"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: cargo watch -w iot-gateway -w crates -w Cargo.toml -x 'run -p iot-gateway'
    environment:
      PORT: 8081
      RUST_LOG: ${RUST_LOG:-iot_gateway=debug,tower_http=info}
      STDB_HOST: http://spacetimedb:3000
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE in .env.docker}
      STDB_TOKEN: ${STDB_TOKEN:?set STDB_TOKEN in .env.docker}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DEFAULT_ORG_ID: ${DEV_MOCK_ORG_ID:-1}
    ports:
      - "8081:8081"
    volumes:
      - .:/workspace
      - cargo-target:/cargo-target
    depends_on:
      spacetimedb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

volumes:
  cargo-target:
  web-node-modules:
  spacetimedb-data:
  qdrant-data:
  owner-report-artifacts:
