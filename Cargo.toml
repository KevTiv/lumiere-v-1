[workspace]
resolver = "2"
members = [
    "api-server",
    "ai-gateway",
    "iot-gateway",
    "api-codegen",
    "crates/stdb-client",
    "crates/stdb-auth",
    "crates/stdb-types",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.7", features = ["macros"] }
bcrypt = "0.15"
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
hex = "0.4"
once_cell = { version = "1", features = ["std"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-cookies = "0.10"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"

stdb-client = { path = "crates/stdb-client" }
stdb-auth = { path = "crates/stdb-auth" }
stdb-types = { path = "crates/stdb-types" }

[profile.release]
opt-level = 3
lto = true
