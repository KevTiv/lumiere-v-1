name: Setup frontend
description: Install pinned pnpm and Node.js with lockfile-based caching

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.31.0

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
