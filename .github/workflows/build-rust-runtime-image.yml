name: Build Rust runtime image

on:
  push:
    branches:
      - main
      - codex/railway-shared-rust-runtime
    paths:
      - Cargo.lock
      - Cargo.toml
      - api-server/**
      - ai-gateway/**
      - crates/**
      - scripts/prepare-vendored-contracts-rust.sh
      - scripts/lumiere-runtime-entrypoint.sh
      - vendor/**
      - Dockerfile.rust-runtime
      - .github/workflows/build-rust-runtime-image.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - api-server/**
      - ai-gateway/**
      - crates/**
      - scripts/prepare-vendored-contracts-rust.sh
      - scripts/lumiere-runtime-entrypoint.sh
      - vendor/**
      - Dockerfile.rust-runtime
      - .github/workflows/build-rust-runtime-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: rust-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate runtime dispatcher
        run: bash scripts/tests/lumiere-runtime-entrypoint.test.sh

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-rust-runtime"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:$image_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust-runtime
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=lumiere-rust-runtime
          cache-to: type=gha,mode=max,scope=lumiere-rust-runtime
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish deployment coordinates
        shell: bash
        run: |
          {
            echo '### Rust runtime image'
            echo
            echo '```text'
            echo '${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
