name: Release contracts v0.3.60
# One-off trigger for the integration branch, which is not on main yet, so
# `release-contracts.yml` cannot be dispatched for it. v0.3.60 widens the
# COV-06/07 read projections. Remove this file once the
# pin has landed.

on:
  push:
    branches: [claude/remaining-implementation-tasks-9ujw4u]
    paths:
      - .github/workflows/release-contracts-v0360.yml

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-contracts.yml
    with:
      version: "0.3.60"
      reason: "COV-06/07 read projections on top of v0.3.59: stock quant availability, serial state, lot location/lock, warehouse QC location"
    secrets: inherit
