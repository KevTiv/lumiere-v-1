name: Release contracts v0.3.59
# One-off trigger for the integration branch, which is not on main yet, so
# `release-contracts.yml` cannot be dispatched for it. v0.3.59 adds
# `UpdateWarehouseParams.clear_wh_qc_stock_loc_id`. Remove this file once the
# pin has landed.

on:
  push:
    branches: [claude/remaining-implementation-tasks-9ujw4u]
    paths:
      - .github/workflows/release-contracts-v0359.yml

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-contracts.yml
    with:
      version: "0.3.59"
      reason: "COV-06k release on top of v0.3.58: update_warehouse can clear the warehouse QC location (UpdateWarehouseParams.clear_wh_qc_stock_loc_id)"
    secrets: inherit
