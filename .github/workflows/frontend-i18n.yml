name: Frontend i18n

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-i18n.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-i18n.yml"

concurrency:
  group: frontend-i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-contracts-ssh
        with:
          deploy-key: ${{ secrets.LUMIERE_CONTRACTS_DEPLOY_KEY }}

      - uses: ./.github/actions/setup-frontend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: i18n (duplicate keys + usage)
        run: pnpm i18n:check
