name: SpacetimeDB recovery drill

on:
  pull_request:
    paths:
      - Dockerfile.spacetimedb-recovery
      - infra/spacetimedb/**
      - scripts/railway-stdb-*
      - scripts/tests/*stdb*recovery*
      - scripts/tests/*stdb*restore*
      - scripts/tests/*stdb*supervisor*
      - scripts/tests/fixtures/stdb-production-upgrade/**
      - .github/workflows/test-stdb-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the synthetic database module
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path scripts/tests/fixtures/stdb-production-upgrade/Cargo.toml
      - name: Build the opt-in recovery image
        run: docker build --file Dockerfile.spacetimedb-recovery --tag lumiere-stdb-recovery-test .
      - name: Exercise S3 capture and isolated restore
        run: |
          bash scripts/tests/test-railway-stdb-recovery-engine.sh \
            lumiere-stdb-recovery-test \
            scripts/tests/fixtures/stdb-production-upgrade/target/wasm32-unknown-unknown/release/lumiere_upgrade_baseline.wasm

  publish-image:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: synthetic-restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image coordinate
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}-spacetimedb-recovery" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.spacetimedb-recovery
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Record immutable recovery image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" >/dev/null
          printf 'Recovery image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
