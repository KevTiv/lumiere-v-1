name: Release contracts
# Keeps every branch pinned to a lumiere-contracts release that matches its
# sources. It runs on each push that changes a contract source, and does
# nothing when the generated contracts still match the pin. Otherwise it
# publishes the next free version and pins it on the branch.
#
# Version: one patch step above the highest of the branch pin and every
# published tag, so concurrent branches never reuse a number. Each component
# rolls over after 999 (0.0.999 -> 0.1.0, 0.999.999 -> 1.0.0). A manual run
# may request an explicit higher version.
#
# Steps: regenerate from a live module, record the operation-history revision
# on top of the pinned release, commit, regenerate from that clean commit,
# build the full candidate without pushing, publish the tag, pin it, and
# verify the pin against a fresh regeneration.

on:
  push:
    # main only receives pins through merged branches.
    branches-ignore: [main]
    # Everything codegen reads to produce the contract IR.
    paths:
      - spacetimedb/**
      - crates/presentation-core/**
      - lumiere-codegen/**
      - crates/stdb-auth/assets/resource_registry.json
      - .github/workflows/build-contracts-module.yml
      - .github/workflows/release-contracts.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit x.y.z version (leave empty for the next free version)"
        type: string
        default: ""
      reason:
        description: "Operation-history revision reason (defaults to a generated summary)"
        type: string
        default: ""

permissions:
  contents: write

# One release at a time per branch; a newer push waits and then releases
# whatever the branch holds by then.
concurrency:
  group: release-contracts-${{ github.ref }}
  cancel-in-progress: false

env:
  SPACETIME_CLI_VERSION: "2.8.2"
  STDB_MODULE: lumiere-release-contracts
  STDB_SCHEMA_SERVER: local
  STDB_SCHEMA_HOST: http://127.0.0.1:3000
  STDB_GENERATE_WASM: .ci/contracts-module.wasm
  # Importing scripts must not leave bytecode for `git add -A` to commit.
  PYTHONDONTWRITEBYTECODE: "1"
  CONTRACTS_REMOTE: git@github.com:KevTiv/lumiere-contracts.git

jobs:
  contracts-module:
    uses: ./.github/workflows/build-contracts-module.yml

  release:
    needs: contracts-module
    runs-on: ubuntu-latest
    steps:
      # The branch head, not the triggering commit: a queued run releases the
      # latest sources.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # A dedicated write key is preferred; the shared deploy key is used when
      # no publish key is configured.
      - uses: ./.github/actions/setup-contracts-ssh
        with:
          deploy-key: ${{ secrets.LUMIERE_CONTRACTS_PUBLISH_KEY || secrets.LUMIERE_CONTRACTS_DEPLOY_KEY }}

      - name: Resolve versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git ls-remote --tags --refs "$CONTRACTS_REMOTE" > "$RUNNER_TEMP/contract-tags"
          python3 - "$RUNNER_TEMP/contract-tags" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          semver = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")

          def parse(version):
              match = semver.fullmatch(version)
              return tuple(int(part) for part in match.groups()) if match else None

          manifest = json.loads(Path("release-compatibility-manifest.json").read_text(encoding="utf-8"))
          previous = manifest["lumiere_contracts"]["version"]
          cargo = Path("Cargo.toml").read_text(encoding="utf-8")
          if f'tag = "v{previous}"' not in cargo:
              raise SystemExit(f"Cargo.toml does not pin v{previous}, the release manifest version")
          pinned = parse(previous)
          if pinned is None:
              raise SystemExit(f"current pin {previous!r} is not x.y.z")

          published = {
              parsed
              for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
              if (parsed := parse(line.rsplit("refs/tags/v", 1)[-1].strip())) is not None
          }
          floor = max(published | {pinned})

          requested = os.environ.get("REQUESTED_VERSION", "").strip()
          if requested:
              wanted = parse(requested)
              if wanted is None:
                  raise SystemExit(f"requested version {requested!r} is not x.y.z")
              if wanted in published:
                  raise SystemExit(f"lumiere-contracts v{requested} already exists")
              if wanted <= pinned:
                  raise SystemExit(f"requested version {requested} must be above the current pin {previous}")
              version = requested
          else:
              major, minor, patch = floor
              patch += 1
              if patch > 999:
                  patch, minor = 0, minor + 1
              if minor > 999:
                  minor, major = 0, major + 1
              version = f"{major}.{minor}.{patch}"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PREVIOUS_VERSION={previous}\n")
              env.write(f"PREVIOUS_REVISION={manifest['lumiere_contracts']['revision']}\n")
              env.write(f"PREVIOUS_IR_SHA256=sha256:{manifest['application_contract']['artifact_sha256']}\n")
              env.write(f"VERSION={version}\n")
          highest = ".".join(map(str, floor))
          print(f"pinned v{previous}, highest published v{highest}; next v{version}")
          PY

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true

      - uses: ./.github/actions/setup-spacetime-cli
        with:
          version: ${{ env.SPACETIME_CLI_VERSION }}

      - name: Download compiled contracts module
        uses: actions/download-artifact@v4
        with:
          name: contracts-module
          path: .ci

      - name: Start standalone SpacetimeDB
        run: |
          nohup spacetime start --listen-addr 127.0.0.1:3000 > /tmp/lumiere-release-stdb.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS -X POST http://127.0.0.1:3000/v1/identity >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lumiere-release-stdb.log
          exit 1

      - name: Publish module
        run: |
          spacetime publish "$STDB_MODULE" --bin-path .ci/contracts-module.wasm --server local --delete-data=always -y --no-config

      - name: Regenerate contracts (pass 1)
        run: |
          make clean-contracts-live-staging
          make generate-presentation-schemas schema-snapshot generate-stdb-rust-sdk generate-stdb-ts-sdk codegen

      - name: Skip when nothing changed
        id: changes
        run: |
          CHECKOUT="$(bash scripts/resolve-pinned-contracts.sh)"
          if python3 scripts/verify-contract-ir.py .contracts-staging/ir/lumiere-contract-ir-v2.json \
              --expect-schema-hash-from "$CHECKOUT/ir/lumiere-contract-ir-v2.json" >/dev/null 2>&1; then
            # The IR hash does not cover the durable PostgreSQL migrations, which
            # are generated from the same sources (and the migration ledger), so a
            # change there is a release on its own.
            if diff -rq "$CHECKOUT/manifests/pg_ddl/migrations" .contracts-staging/manifests/pg_ddl/migrations >/dev/null 2>&1 \
                && cmp -s "$CHECKOUT/manifests/durable-pg-schema-manifest.json" .contracts-staging/manifests/durable-pg-schema-manifest.json; then
              echo "Generated contracts match v$PREVIOUS_VERSION; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "IR matches v$PREVIOUS_VERSION but the durable PostgreSQL migrations differ; releasing."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Every operation added or reshaped since the pinned release is recorded
      # as one release-bound revision.
      - name: Record operation-history revision
        if: steps.changes.outputs.release == 'true'
        env:
          REVISION_REASON: ${{ inputs.reason }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("history", "scripts/verify-operation-history.py")
          history = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(history)

          path = Path("lumiere-codegen/contract-operation-history.json")
          previous = json.loads(path.read_text(encoding="utf-8"))
          history._validate_history(previous)
          current = history.build_history(Path(".contracts-staging/ir/lumiere-contract-ir-v2.json"))
          # The revision chain binds the recorded operations; shape comparison
          # uses them with approved compatibility exceptions applied.
          recorded_operations = previous["operations"]
          previous_operations = json.loads(json.dumps(recorded_operations))
          for exception in previous["compatibility_exceptions"]:
              if exception["operation_id"] in previous_operations:
                  previous_operations[exception["operation_id"]]["shape_fingerprint"] = exception["current_fingerprint"]
          missing = sorted(set(previous_operations) - set(current["operations"]))
          if missing:
              raise SystemExit(f"release must not drop operations: {missing}")
          for operation_id, entry in previous_operations.items():
              if entry["name"] != current["operations"][operation_id]["name"]:
                  raise SystemExit(f"release must not rename {operation_id}")
          added = sorted(set(current["operations"]) - set(previous_operations))
          changed = sorted(
              operation_id
              for operation_id, entry in previous_operations.items()
              if entry["shape_fingerprint"] != current["operations"][operation_id]["shape_fingerprint"]
          )
          print("added:", added)
          print("changed:", changed)
          if not added and not changed:
              print("operation set unchanged; history needs no revision")
              raise SystemExit(0)

          def names(ids):
              return ", ".join(operation_id.removeprefix("erp.") for operation_id in ids) or "none"

          reason = os.environ["REVISION_REASON"].strip() or (
              f"release on top of v{os.environ['PREVIOUS_VERSION']}: add {names(added)}; "
              f"change the shape of {names(changed)}"
          )
          current["retired_ids"] = previous["retired_ids"]
          current["revisions"] = list(previous.get("revisions", []))
          current["revisions"].append({
              "previous_release": "v" + os.environ["PREVIOUS_VERSION"],
              "previous_ir_sha256": os.environ["PREVIOUS_IR_SHA256"],
              "previous_operations_fingerprint": history.operation_set_fingerprint(recorded_operations),
              "current_operations_fingerprint": history.operation_set_fingerprint(current["operations"]),
              "operation_count": len(current["operations"]),
              "reason": reason,
          })
          path.write_text(json.dumps(current, indent=2) + "\n", encoding="utf-8")
          PY
          python3 scripts/verify-operation-history.py

      - name: Commit regenerated sources
        if: steps.changes.outputs.release == 'true'
        run: |
          git add -A
          git status --short
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(contracts): regenerate for v$VERSION"
            # Nothing is published yet, so a branch that moved meanwhile only
            # needs the queued run for its newer push.
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::error::${GITHUB_REF_NAME} moved during the release; the run for the newer push releases it."
              exit 1
            fi
          fi

      - name: Regenerate from the clean commit (pass 2)
        if: steps.changes.outputs.release == 'true'
        run: |
          make clean-contracts-live-staging
          make generate-presentation-schemas schema-snapshot generate-stdb-rust-sdk generate-stdb-ts-sdk codegen
          dirty="$(git status --porcelain --untracked-files=normal -- spacetimedb crates/presentation-core lumiere-codegen crates/stdb-auth/assets/resource_registry.json)"
          if [ -n "$dirty" ]; then
            echo "Regeneration is not reproducible from the committed tree:"
            echo "$dirty"
            git diff --stat
            exit 1
          fi
          python3 scripts/verify-operation-history.py
          python3 scripts/verify-contract-ir.py .contracts-staging/ir/lumiere-contract-ir-v2.json --require-clean

      # The presentation contract generator imports frontend dev dependencies
      # (json-schema-to-typescript).
      - uses: ./.github/actions/setup-frontend
        if: steps.changes.outputs.release == 'true'

      - name: Install frontend dependencies
        if: steps.changes.outputs.release == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Restore contract release npm cache
        if: steps.changes.outputs.release == 'true'
        uses: actions/cache@v4
        with:
          path: target/contracts-release/npm-cache
          key: contracts-release-npm-v1-${{ runner.os }}-${{ hashFiles('release-compatibility-manifest.json') }}
          restore-keys: |
            contracts-release-npm-v1-${{ runner.os }}-

      # Build and check the full candidate first; nothing remote changes if it fails.
      - name: Prepare contracts release
        if: steps.changes.outputs.release == 'true'
        env:
          LUMIERE_CONTRACTS_PREPARE_DIR: ${{ runner.temp }}/contracts-release
        # Pass 2 already rebuilt and verified the staging tree from the clean
        # commit. Do not run the generation prerequisites for a third time.
        run: make publish-contracts-prepared VERSION="$VERSION"

      - name: Publish contracts release
        if: steps.changes.outputs.release == 'true'
        working-directory: ${{ runner.temp }}/contracts-release/repo
        run: |
          git push origin HEAD:main
          git -c user.name="lumiere-codegen" -c user.email="codegen@lumiere.local" \
            tag -a "v$VERSION" -m "Generated contracts release v$VERSION"
          git push origin "v$VERSION"

      - name: Pin the release
        if: steps.changes.outputs.release == 'true'
        run: |
          REVISION="$(git -C "$RUNNER_TEMP/contracts-release/repo" rev-parse HEAD)"
          sed -i "s/tag = \"v$PREVIOUS_VERSION\"/tag = \"v$VERSION\"/" Cargo.toml
          sed -i "s/lumiere-contracts#v$PREVIOUS_VERSION&/lumiere-contracts#v$VERSION\&/" \
            frontend/packages/presentation-core/package.json \
            frontend/packages/query-hooks/package.json \
            frontend/packages/stdb/package.json
          # The old revision appears in specifiers, package keys and the git
          # resolution; the resolved package entry also records the version.
          sed -i "s/lumiere-contracts#v$PREVIOUS_VERSION&/lumiere-contracts#v$VERSION\&/; s/$PREVIOUS_REVISION/$REVISION/g" \
            frontend/pnpm-lock.yaml
          sed -i "/resolution: {commit: $REVISION, path: packages\/contracts/{n;s/^    version: $PREVIOUS_VERSION\$/    version: $VERSION/}" \
            frontend/pnpm-lock.yaml
          if grep -q "$PREVIOUS_REVISION" frontend/pnpm-lock.yaml; then echo "pnpm-lock.yaml still references $PREVIOUS_REVISION"; exit 1; fi
          sed -i "s/v$PREVIOUS_VERSION/v$VERSION/g" api-server/src/presentation_dictionary.rs
          cargo update -p lumiere-contracts
          grep -q "tag=v$VERSION#$REVISION" Cargo.lock
          # Migration SQL ships in lumiere-contracts, so the application catalog
          # checksum moves with the pin; compute it with the runtime's own function.
          export CATALOG_CHECKSUM="$(cargo run -q --locked -p api-server --example migration_catalog_checksum)"
          case "$CATALOG_CHECKSUM" in sha256:*) ;; *) echo "bad catalog checksum: $CATALOG_CHECKSUM"; exit 1 ;; esac
          CHECKOUT="$(bash scripts/resolve-pinned-contracts.sh)"
          python3 - "$CHECKOUT" "$REVISION" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          checkout, revision = Path(sys.argv[1]), sys.argv[2]
          version = os.environ["VERSION"]
          pin = json.loads((checkout / "ir/PIN.json").read_text(encoding="utf-8"))
          path = Path("release-compatibility-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["application_contract"].update({
              "artifact_sha256": pin["artifact_sha256"],
              "schema_hash": pin["schema_hash"],
              "source_commit": pin["source_commit"],
              "source_repository": pin["source_repository"],
          })
          durable = manifest["durable_postgres"]
          durable["checksum"] = "sha256:" + hashlib.sha256((checkout / durable["sql_path"]).read_bytes()).hexdigest()
          durable["application_catalog_checksum"] = os.environ["CATALOG_CHECKSUM"]
          manifest["lumiere_contracts"].update({"version": version, "tag": f"v{version}", "revision": revision})
          history = Path(manifest["operation_history"]["path"]).read_bytes()
          manifest["operation_history"]["checksum"] = "sha256:" + hashlib.sha256(history).hexdigest()
          manifest["minimum_client_contract"]["generated_contract_release"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          python3 scripts/verify-release-manifest.py
          git diff --stat

      - name: Verify the pin matches regeneration
        if: steps.changes.outputs.release == 'true'
        run: make check-contracts-drift STDB_MODULE="$STDB_MODULE"

      - name: Commit the pin
        if: steps.changes.outputs.release == 'true'
        run: |
          git add Cargo.toml Cargo.lock frontend/packages/presentation-core/package.json \
            frontend/packages/query-hooks/package.json frontend/packages/stdb/package.json \
            frontend/pnpm-lock.yaml api-server/src/presentation_dictionary.rs \
            release-compatibility-manifest.json
          git -c user.name="github-actions[bot]" -c user.email="41898+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(contracts): publish and pin v$VERSION"
          # The tag is already published, so land the pin even if the branch
          # moved: replay it on top. A newer contract change there triggers
          # its own release.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            # A rebase recommits the pin, so it needs the same identity as the commit.
            git -c user.name="github-actions[bot]" -c user.email="41898+github-actions[bot]@users.noreply.github.com" \
              pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push the v$VERSION pin to ${GITHUB_REF_NAME}; pin it by hand."
          exit 1
