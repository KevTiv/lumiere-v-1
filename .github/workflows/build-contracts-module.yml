name: Build contracts module

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source revision to compile; defaults to the branch head for artifact publishing
        required: false
        default: ''
        type: string
      production:
        description: Exclude developer seed and test reducers from the artifact
        required: false
        default: false
        type: boolean
      alpha_founder_identities:
        description: Exact comma-separated alpha founder SpacetimeDB identities compiled into the artifact
        required: false
        default: ''
        type: string
      alpha_additional_tenant_approval:
        description: Exact identity:source-organization-id:target-code exception; empty denies
        required: false
        default: ''
        type: string

env:
  CONTRACTS_MODULE_ARTIFACT: contracts-module

jobs:
  build:
    name: Build contracts module
    runs-on: ubuntu-latest
    # Release and pull-request validation can start for the same branch at the
    # same time. Serialize only this build job so the first caller fills the
    # exact-source cache and the second caller restores it instead of compiling
    # the same WASM again.
    concurrency:
      group: contracts-module-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Fingerprint alpha admission policy
        id: alpha-policy
        env:
          ALPHA_FOUNDER_IDENTITIES: ${{ inputs.alpha_founder_identities }}
          ALPHA_ADDITIONAL_TENANT_APPROVAL: ${{ inputs.alpha_additional_tenant_approval }}
        run: |
          policy_hash="$(printf '%s\0%s' "$ALPHA_FOUNDER_IDENTITIES" "$ALPHA_ADDITIONAL_TENANT_APPROVAL" | sha256sum | cut -d ' ' -f 1)"
          echo "digest=$policy_hash" >> "$GITHUB_OUTPUT"

      - name: Restore compiled contracts module
        id: contracts-module
        uses: actions/cache@v4
        with:
          path: .ci/contracts-module.wasm
          key: contracts-module-v5-${{ inputs.production && 'production-lean' || 'development-fixtures' }}-${{ steps.alpha-policy.outputs.digest }}-${{ runner.os }}-${{ hashFiles('spacetimedb/src/**', 'spacetimedb/tests/**', 'spacetimedb/assets/**', 'spacetimedb/Cargo.toml', 'spacetimedb/Cargo.lock', 'crates/presentation-core/src/**', 'crates/presentation-core/Cargo.toml', 'crates/policy-core/src/**', 'crates/policy-core/Cargo.toml', 'lumiere-codegen/storage-policy-manifest.json', 'crates/stdb-auth/assets/resource_registry.json') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.contracts-module.outputs.cache-hit != 'true'
        with:
          workspaces: spacetimedb
          cache-on-failure: true

      # Schema extraction is optimization-independent. This profile avoids the
      # size-optimized release build, which is substantially slower.
      - name: Compile contracts module
        if: steps.contracts-module.outputs.cache-hit != 'true'
        env:
          LUMIERE_ENABLE_DEV_REDUCERS: '0'
          LUMIERE_ALPHA_FOUNDER_IDENTITIES: ${{ inputs.alpha_founder_identities }}
          LUMIERE_ALPHA_ADDITIONAL_TENANT_APPROVAL: ${{ inputs.alpha_additional_tenant_approval }}
        run: |
          if [[ '${{ inputs.production }}' == 'true' ]]; then
            make contracts-module-production-ci
          else
            # Development in-module tests intentionally create fixture tenants.
            # The production branch never overrides the default denial above.
            LUMIERE_ENABLE_DEV_REDUCERS=1 make contracts-module-ci
          fi

      - name: Export contracts module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CONTRACTS_MODULE_ARTIFACT }}
          path: .ci/contracts-module.wasm
          if-no-files-found: error
          retention-days: 1
