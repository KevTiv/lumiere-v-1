name: E2E smoke

# Full browser smoke requires local SpacetimeDB, api-server, and seeded fixtures.
# Default CI (ci.yml) only validates Playwright tests compile via `playwright test --list`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Playwright suite (p0 = critical smoke, full = all tests)"
        type: choice
        options:
          - p0
          - full
        default: p0
      clear_db:
        description: "Wipe local module data before publish (E2E_CLEAR_DB=1)"
        type: boolean
        default: true
  schedule:
    # Weekly Monday 08:00 UTC
    - cron: "0 8 * * 1"

env:
  STDB_MODULE: lumiere-v1-j1uo0
  STDB_HOST: http://127.0.0.1:3000
  E2E_WEB_PORT: "3100"
  E2E_API_PORT: "8082"
  # Same pin as ci.yml's contracts-drift job — keeps the CLI version this
  # suite publishes with identical to the one contracts drift validates
  # against, and gives the cache step below a stable key.
  SPACETIME_CLI_VERSION: "2.8.2"

jobs:
  scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.scope.outputs.valid }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-change-scope.py --github-output "$GITHUB_OUTPUT"
      - name: Test change classifier
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_change_scope.py'

  plan:
    name: Plan E2E matrix
    needs: scope
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.plan.outputs.configs }}
    steps:
      - id: plan
        run: |
          case "${{ github.event_name }}" in
            push)
              # Main retains one complete run; PRs use the bounded P0 suite.
              configs='[{"suite":"full","clear_db":"1"}]'
              ;;
            pull_request)
              configs='[{"suite":"p0","clear_db":"0"}]'
              ;;
            schedule)
              configs='[{"suite":"full","clear_db":"1"}]'
              ;;
            workflow_dispatch)
              suite="${{ github.event.inputs.suite || 'p0' }}"
              if [ "${{ github.event.inputs.clear_db }}" = "true" ]; then
                clear_db="1"
              else
                clear_db="0"
              fi
              configs="[{\"suite\":\"${suite}\",\"clear_db\":\"${clear_db}\"}]"
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac
          echo "configs=${configs}" >> "$GITHUB_OUTPUT"

  e2e-smoke:
    name: Playwright smoke (${{ matrix.config.suite }})
    needs: [scope, plan]
    if: needs.plan.result == 'success' && needs.scope.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumiere
          POSTGRES_USER: lumiere
          POSTGRES_PASSWORD: lumiere
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumiere -d lumiere"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    concurrency:
      group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}-${{ matrix.config.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spacetimedb
            .
          cache-on-failure: true

      # The install unpacks a ~150MB binary bundle; cached by exact version,
      # so this only actually downloads again when SPACETIME_CLI_VERSION
      # changes. Mirrors ci.yml's contracts-drift job.
      - uses: ./.github/actions/setup-spacetime-cli
        with:
          version: ${{ env.SPACETIME_CLI_VERSION }}

      - uses: ./.github/actions/setup-contracts-ssh
        with:
          deploy-key: ${{ secrets.LUMIERE_CONTRACTS_DEPLOY_KEY }}

      - uses: ./.github/actions/setup-frontend

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # api-server's build script consumes the generated Rust bindings from
      # .contracts-staging. Resolve the pinned contracts checkout and stage it
      # before the E2E target builds api-server.
      - name: Populate .contracts-staging from pinned lumiere-contracts
        run: |
          cargo fetch --locked
          make contracts-staging-from-pinned

      # Caches the downloaded browser binary only (keyed on the pinned
      # playwright version in the lockfile); system deps from --with-deps
      # still install every run since apt state isn't persisted across
      # runners, but that step is fast — the browser download is what's slow.
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        working-directory: frontend/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Cache Next.js intermediate output
        uses: actions/cache@v4
        with:
          # Cache compiler data only, never Next's runtime fetch cache.
          path: |
            frontend/web/.next/cache/webpack
            frontend/web/.next/cache/turbopack
            frontend/web/.next/cache/swc
          key: next-compiler-v1-${{ runner.os }}-node22-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/web/next.config.*', 'frontend/web/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            next-compiler-v1-${{ runner.os }}-node22-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/web/next.config.*', 'frontend/web/tsconfig.json') }}-

      - name: Run make e2e-smoke
        env:
          E2E_SUITE: ${{ matrix.config.suite }}
          E2E_CLEAR_DB: ${{ matrix.config.clear_db }}
          NEXT_PUBLIC_STDB_MODULE: ${{ env.STDB_MODULE }}
          NEXT_PUBLIC_STDB_HOST: ${{ env.STDB_HOST }}
          PG_HOST: 127.0.0.1
          PG_PORT: "5432"
          PG_DATABASE: lumiere
          PG_USER: lumiere
          PG_PASSWORD: lumiere
          PG_TLS_MODE: disable
        run: |
          # Makefile defaults to a macOS dev PATH; use the runner PATH in CI.
          export E2E_PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.cargo/bin:${HOME}/.local/bin:${PNPM_HOME}"
          echo "E2E_SUITE=${E2E_SUITE} E2E_CLEAR_DB=${E2E_CLEAR_DB}"
          make e2e-smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.config.suite }}
          path: frontend/web/playwright-report/
          retention-days: 7

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.config.suite }}
          path: .tmp/e2e/
          retention-days: 7

  gate:
    name: E2E gate
    if: always()
    needs: [scope, plan, e2e-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require scope and E2E result
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.scope.outputs.valid }}" = true
          test "${{ needs.plan.result }}" = success
          case "${{ needs.scope.outputs.run_e2e }}:${{ needs.e2e-smoke.result }}" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
