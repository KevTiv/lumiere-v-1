name: One-time alpha history evidence refresh
on:
  push:
    branches:
      - codex/documents-viewer-recovery
    paths:
      - .github/workflows/once-refresh-alpha-history.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'KevTiv/lumiere-v-1' && github.ref == 'refs/heads/codex/documents-viewer-recovery'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild tracked source evidence
        run: |
          python3 -B scripts/generate-finance-change-review-inventory.py
          python3 -B scripts/generate-alpha-history-inventory.py
          python3 -B scripts/generate-finance-change-review-inventory.py --check
          python3 -B scripts/generate-alpha-history-inventory.py --check
          git diff --check
      - name: Commit only regenerated evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/evidence/finance-alpha-change-review-inventory.json docs/evidence/alpha-history-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(evidence): regenerate alpha history after document lifecycle changes"
            git push origin HEAD:refs/heads/codex/documents-viewer-recovery
          fi
