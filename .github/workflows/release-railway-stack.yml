name: Release Railway stack

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
      environment:
        description: GitHub and Railway environment
        required: true
        default: production
        type: choice
        options:
          - dev
          - production
      expected_region:
        description: Required Railway runtime region for infrastructure services
        required: true
        default: europe-west4-drams3a
        type: string
      rust_runtime_image:
        description: Immutable shared Rust image (defaults to release SHA tag)
        required: false
        type: string
      enable_ai:
        description: Promote the optional AI gateway (disabled for the initial release)
        required: true
        default: false
        type: boolean
      enable_integrations:
        description: Activate integration workers after real organization IDs and service bindings are configured
        required: true
        default: false
        type: boolean
      enable_owner_reports:
        description: Activate the provisioned owner-report worker
        required: true
        default: false
        type: boolean
      edge_readiness_url:
        description: Public API-gateway URL to probe after cutover (required for production)
        required: false
        type: string

  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      environment:
        required: true
        type: string
      expected_region:
        default: europe-west4-drams3a
        type: string
      rust_runtime_image:
        default: ''
        type: string
      enable_ai:
        default: false
        type: boolean
      enable_integrations:
        default: false
        type: boolean
      enable_owner_reports:
        default: false
        type: boolean
      edge_readiness_url:
        default: ''
        type: string
      require_current_main:
        description: Refuse an obsolete automatic release before mutating production
        default: false
        type: boolean

concurrency:
  group: railway-stack-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: cc695d4b-030c-43e3-bbd6-a41095b09257
  RAILWAY_CLI_VERSION: 5.67.1
  RAILWAY_NO_AUTO_UPDATE: "1"
  RAILWAY_CALLER: workflow:release-railway-stack

jobs:
  release:
    name: Ordered stack release (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: ${{ inputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ inputs.environment }}
      RAILWAY_EXPECTED_REGION: ${{ inputs.expected_region }}
      RELEASE_ROOT: .
      RELEASE_SHA: ${{ inputs.release_sha }}
      RUST_RUNTIME_IMAGE: ${{ inputs.rust_runtime_image }}
      RAILWAY_ENABLE_AI: ${{ inputs.enable_ai }}
      RAILWAY_ENABLE_INTEGRATIONS: ${{ inputs.enable_integrations }}
      RAILWAY_ENABLE_OWNER_REPORTS: ${{ inputs.enable_owner_reports }}
      API_READINESS_URL: ${{ secrets.RAILWAY_API_READINESS_URL }}
      AI_READINESS_URL: ${{ secrets.RAILWAY_AI_READINESS_URL }}
      CHROMIUM_READINESS_URL: ${{ secrets.RAILWAY_CHROMIUM_READINESS_URL }}
      OWNER_REPORT_READINESS_URL: ${{ secrets.RAILWAY_OWNER_REPORT_READINESS_URL }}
      WORKFLOW_READINESS_URL: ${{ secrets.RAILWAY_WORKFLOW_READINESS_URL }}
      PROJECTION_READINESS_URL: ${{ secrets.RAILWAY_PROJECTION_READINESS_URL }}
      EXPENSE_INTEGRATION_READINESS_URL: ${{ secrets.RAILWAY_EXPENSE_INTEGRATION_READINESS_URL }}
      HR_INTEGRATION_READINESS_URL: ${{ secrets.RAILWAY_HR_INTEGRATION_READINESS_URL }}
      PROJECT_INTEGRATION_READINESS_URL: ${{ secrets.RAILWAY_PROJECT_INTEGRATION_READINESS_URL }}
      WEB_READINESS_URL: ${{ secrets.RAILWAY_WEB_READINESS_URL }}
      EDGE_READINESS_URL: ${{ inputs.edge_readiness_url }}
    steps:
      - name: Validate immutable release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a lowercase full 40-character commit SHA" >&2
            exit 1
          }
          [[ "$RAILWAY_EXPECTED_REGION" =~ ^[a-z0-9-]+$ ]] || {
            echo "expected_region contains unsupported characters" >&2
            exit 1
          }
          [[ -z "$RUST_RUNTIME_IMAGE" || "$RUST_RUNTIME_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "rust_runtime_image must be an immutable lowercase GHCR digest" >&2
            exit 1
          }
          : "${RAILWAY_TOKEN:?Configure RAILWAY_TOKEN on the selected GitHub Environment}"
          if [[ "$RAILWAY_ENVIRONMENT" == production && -z "$EDGE_READINESS_URL" ]]; then
            echo "Production releases require edge_readiness_url" >&2
            exit 1
          fi
          if [[ "$RAILWAY_ENVIRONMENT" == production && "$RAILWAY_ENABLE_INTEGRATIONS" == true ]]; then
            for readiness_name in \
              EXPENSE_INTEGRATION_READINESS_URL \
              HR_INTEGRATION_READINESS_URL \
              PROJECT_INTEGRATION_READINESS_URL; do
              [[ -n "${!readiness_name}" ]] || {
                echo "Production releases require $readiness_name" >&2
                exit 1
              }
            done
          fi

      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - name: Verify production ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [[ "$RAILWAY_ENVIRONMENT" == production ]]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if [[ '${{ inputs.require_current_main }}' == true && "$RELEASE_SHA" != "$(git rev-parse origin/main)" ]]; then
              echo "A newer main revision superseded this automatic release; refusing to roll production back" >&2
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main || {
              echo "Production releases must be main or an ancestor of main" >&2
              exit 1
            }
          fi

      - name: Install pinned Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"

      - uses: docker/setup-buildx-action@v3

      - name: Gate anonymous release image pulls and revisions
        shell: bash
        run: bash scripts/railway-release-images.sh

      - name: Verify Railway access and context
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"
          railway service list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --json | jq '[.[] | {id, name}]'

      - name: Verify production Railway topology and worker configuration
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/railway-production-preflight.sh \
            infra/railway/production-eu-services.json

      - name: Phase 1 — gate EU infrastructure
        shell: bash
        run: >-
          bash scripts/railway-stack-release.sh gate
          Postgres spacetimedb kong-postgres

      - name: Phase 1 AI gate — vector store
        if: inputs.enable_ai
        shell: bash
        run: bash scripts/railway-stack-release.sh gate qdrant

      - name: Phase 2 — publish and verify SpacetimeDB module
        shell: bash
        run: bash scripts/railway-stack-release.sh promote-publisher spacetimedb-publisher

      - name: Phase 3 — apply PostgreSQL storage migrations from shared runtime image
        shell: bash
        run: bash scripts/railway-stack-release.sh redeploy-storage storage-migrate

      - name: Phase 4 — deploy Chromium worker
        shell: bash
        run: bash scripts/railway-stack-release.sh promote-image chromium-worker "$CHROMIUM_IMAGE"

      - name: Phase 4 gate — Chromium readiness
        if: env.CHROMIUM_READINESS_URL != ''
        shell: bash
        run: bash scripts/railway-stack-release.sh probe "chromium=$CHROMIUM_READINESS_URL"

      - name: Phase 5 — deploy API server from shared runtime image
        shell: bash
        run: bash scripts/railway-stack-release.sh redeploy-source api-server

      - name: Phase 5 gate — API readiness
        if: env.API_READINESS_URL != ''
        shell: bash
        run: bash scripts/railway-stack-release.sh probe "api-server=$API_READINESS_URL"

      - name: Phase 6 — deploy AI gateway from shared runtime image
        if: inputs.enable_ai
        shell: bash
        run: bash scripts/railway-stack-release.sh redeploy-source ai-gateway

      - name: Phase 6 gate — AI readiness
        if: inputs.enable_ai && env.AI_READINESS_URL != ''
        shell: bash
        run: bash scripts/railway-stack-release.sh probe "ai-gateway=$AI_READINESS_URL"

      - name: Phase 7 — deploy projection worker from shared runtime image
        shell: bash
        run: bash scripts/railway-stack-release.sh redeploy-source projection-worker

      - name: Phase 7 gate — projection readiness
        if: env.PROJECTION_READINESS_URL != ''
        shell: bash
        run: bash scripts/railway-stack-release.sh probe "projection=$PROJECTION_READINESS_URL"

      - name: Phase 8 — deploy workflow and owner-report workers from shared runtime image
        shell: bash
        run: bash scripts/railway-stack-release.sh redeploy-source workflow-worker

      - name: Phase 8 — deploy provisioned owner-report worker
        if: inputs.enable_owner_reports
        shell: bash
        run: bash scripts/railway-stack-release.sh redeploy-source owner-report-worker

      - name: Phase 8 gate — workflow and owner-report readiness
        if: env.WORKFLOW_READINESS_URL != '' || (inputs.enable_owner_reports && env.OWNER_REPORT_READINESS_URL != '')
        shell: bash
        run: |
          set -euo pipefail
          probes=()
          [[ "$RAILWAY_ENABLE_OWNER_REPORTS" != true || -z "$OWNER_REPORT_READINESS_URL" ]] || probes+=("owner-report=$OWNER_REPORT_READINESS_URL")
          [[ -z "$WORKFLOW_READINESS_URL" ]] || probes+=("workflow=$WORKFLOW_READINESS_URL")
          bash scripts/railway-stack-release.sh probe "${probes[@]}"

      - name: Phase 9 — deploy production integration workers from shared runtime image
        if: inputs.environment == 'production' && inputs.enable_integrations
        shell: bash
        run: >-
          bash scripts/railway-stack-release.sh redeploy-source
          expense-integration-worker hr-integration-worker project-integration-worker

      - name: Phase 9 gate — production integration-worker readiness
        if: inputs.environment == 'production' && inputs.enable_integrations
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/railway-stack-release.sh probe \
            "expense-integration=$EXPENSE_INTEGRATION_READINESS_URL" \
            "hr-integration=$HR_INTEGRATION_READINESS_URL" \
            "project-integration=$PROJECT_INTEGRATION_READINESS_URL"

      - name: Phase 10 — deploy web
        shell: bash
        run: bash scripts/railway-stack-release.sh promote-image web "$WEB_IMAGE"

      - name: Phase 10 gate — web readiness
        if: env.WEB_READINESS_URL != ''
        shell: bash
        run: bash scripts/railway-stack-release.sh probe "web=$WEB_READINESS_URL"

      - name: Phase 11 — deploy API gateway last
        shell: bash
        run: bash scripts/railway-stack-release.sh promote-image api-gateway "$API_GATEWAY_IMAGE"

      - name: Phase 11 gate — public edge readiness
        if: env.EDGE_READINESS_URL != ''
        shell: bash
        run: bash scripts/railway-stack-release.sh probe "api-gateway=$EDGE_READINESS_URL"

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          for service in \
            Postgres kong-postgres qdrant spacetimedb spacetimedb-publisher storage-migrate \
            api-server ai-gateway chromium-worker owner-report-worker \
            workflow-worker projection-worker expense-integration-worker \
            hr-integration-worker project-integration-worker web api-gateway; do
            echo "::group::$service deployments"
            railway deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --service "$service" \
              --limit 3 \
              --json | jq '.'
            echo "::endgroup::"
          done
