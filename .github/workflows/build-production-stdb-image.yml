name: Build production SpacetimeDB publisher

on:
  push:
    branches: [codex/railway-production-completion]
    paths:
      - spacetimedb/**
      - crates/presentation-core/**
      - crates/policy-core/**
      - lumiere-codegen/storage-policy-manifest.json
      - crates/stdb-auth/assets/resource_registry.json
      - scripts/railway-publish-spacetimedb.sh
      - scripts/test-stdb-production-upgrade.py
      - scripts/tests/fixtures/stdb-production-upgrade/**
      - Dockerfile.spacetimedb-publisher-artifact
      - .github/workflows/build-contracts-module.yml
      - .github/workflows/build-production-stdb-image.yml
  pull_request:
    paths:
      - spacetimedb/**
      - crates/presentation-core/**
      - crates/policy-core/**
      - lumiere-codegen/storage-policy-manifest.json
      - crates/stdb-auth/assets/resource_registry.json
      - scripts/railway-publish-spacetimedb.sh
      - scripts/test-stdb-production-upgrade.py
      - scripts/tests/fixtures/stdb-production-upgrade/**
      - Dockerfile.spacetimedb-publisher-artifact
      - .github/workflows/build-contracts-module.yml
      - .github/workflows/build-production-stdb-image.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: Exact main revision selected by the stack release
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-stdb-${{ github.workflow }}-${{ inputs.release_sha || github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/build-contracts-module.yml
    with:
      source_ref: ${{ inputs.release_sha }}
      production: true
      alpha_founder_identities: ${{ vars.LUMIERE_ALPHA_FOUNDER_IDENTITIES }}
  publish:
    needs: module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: contracts-module
          path: .ci
      - uses: ./.github/actions/setup-spacetime-cli
        with:
          version: '2.8.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify populated production schema upgrade
        run: python3 scripts/test-stdb-production-upgrade.py .ci/contracts-module.wasm
      - name: Verify production module provisioning in an isolated database
        shell: bash
        run: |
          set -euo pipefail
          spacetime start --listen-addr 127.0.0.1:3000 > "$RUNNER_TEMP/stdb-provisioning.log" 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -X POST http://127.0.0.1:3000/v1/identity >/dev/null; then break; fi
            sleep 1
          done
          spacetime publish lumiere-provisioning-test --bin-path .ci/contracts-module.wasm --server local -y --no-config
          if spacetime call lumiere-provisioning-test dev_promote_caller_superuser --server local -y --no-config; then
            echo 'Production module must reject dev privilege escalation' >&2
            exit 1
          fi
          if spacetime call lumiere-provisioning-test test_bootstrap_new_tenant_records_complete_commit --server local -y --no-config; then
            echo 'Production module must not expose test reducers' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: image
        shell: bash
        env:
          IMAGE_SOURCE_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-spacetimedb-publisher"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:$IMAGE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Preserve existing commit image
        id: existing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          if manifest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2>/dev/null)"; then
            digest="$(jq -er '.digest' <<<"$manifest")"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable image $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.digest == ''
        id: build
        with:
          context: .
          file: Dockerfile.spacetimedb-publisher-artifact
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=production-stdb-publisher
          cache-to: type=gha,scope=production-stdb-publisher,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify public immutable deployment coordinate
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          task_docker_config="$(mktemp -d)"
          DOCKER_CONFIG="$task_docker_config" docker manifest inspect "$IMAGE" >/dev/null
          echo "spacetimedb-publisher: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
