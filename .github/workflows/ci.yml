name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.scope.outputs.valid }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      run_rust: ${{ steps.scope.outputs.run_rust }}
      run_contracts: ${{ steps.scope.outputs.run_contracts }}
      run_frontend: ${{ steps.scope.outputs.run_frontend }}
      run_pdf: ${{ steps.scope.outputs.run_pdf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Determine validation scope
        run: python3 scripts/ci-change-scope.py --github-output "$GITHUB_OUTPUT"
      - name: Test change classifier
        run: python3 -B -m unittest discover -s scripts/tests
      - name: Test external readiness probe
        run: node scripts/tests/test-compose-readiness.mjs

  stdb-check:
    name: SpacetimeDB check
    needs: scope
    if: needs.scope.outputs.run_contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spacetimedb
          cache-on-failure: true
      - name: Check standalone module and tests
        working-directory: spacetimedb
        run: cargo check --locked --tests

  rust:
    name: Rust
    needs: scope
    if: needs.scope.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumiere
          POSTGRES_USER: lumiere
          POSTGRES_PASSWORD: lumiere
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lumiere -d lumiere"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/setup-contracts-ssh
        with:
          deploy-key: ${{ secrets.LUMIERE_CONTRACTS_DEPLOY_KEY }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spacetimedb
            .
          cache-on-failure: true

      # No `spacetime` CLI in this runner, so bindings can't be regenerated
      # from the live module here — populate .contracts-staging/ from the
      # currently pinned lumiere-contracts release instead. Schema-affecting
      # changes are verified locally via `make check-contracts-drift`
      # (requires the spacetime CLI) before publishing a new contracts tag.
      - name: Populate .contracts-staging from pinned lumiere-contracts
        run: make contracts-staging-from-pinned

      - name: Workspace members (api-server, ai-gateway, lumiere-codegen, stdb-auth)
        run: cargo check --locked -p api-server -p ai-gateway -p lumiere-codegen -p stdb-auth

      - name: C3 PostgreSQL projection matrix
        env:
          C3_TEST_PG: "1"
          PG_HOST: 127.0.0.1
          PG_PORT: "5432"
          PG_DATABASE: lumiere
          PG_USER: lumiere
          PG_PASSWORD: lumiere
          PG_TLS_MODE: disable
        run: python3 scripts/run-required-cargo-tests.py --locked -p api-server --lib cold_tier::commit_projection::tests::postgres_manifest_matrix -- --nocapture

      - name: C4 PostgreSQL release compatibility
        env:
          C4_TEST_PG: "1"
          PG_HOST: 127.0.0.1
          PG_PORT: "5432"
          PG_DATABASE: lumiere
          PG_USER: lumiere
          PG_PASSWORD: lumiere
          PG_TLS_MODE: disable
        run: python3 scripts/run-required-cargo-tests.py --locked -p api-server --lib cold_tier::migrate::postgres_compatibility_tests::postgres_current_next_application_rollback -- --nocapture

      - name: C5 manifest-driven finalization
        env:
          C5_TEST_PG: "1"
          PG_HOST: 127.0.0.1
          PG_PORT: "5432"
          PG_DATABASE: lumiere
          PG_USER: lumiere
          PG_PASSWORD: lumiere
          PG_TLS_MODE: disable
        run: |
          python3 scripts/run-required-cargo-tests.py --locked -p api-server --lib cold_tier::finalization_worker:: -- --nocapture
          python3 scripts/run-required-cargo-tests.py --locked -p api-server --lib cold_tier::ledger:: -- --nocapture

      - name: lumiere-codegen unit tests
        run: cargo test --locked -p lumiere-codegen

      - name: Realtime build generation regression
        run: bash scripts/test-build-rs-generation.sh

      - name: SpacetimeDB Rust generator recovery test
        run: bash scripts/test-generate-spacetimedb-rust-sdk.sh

      - name: Verify generated TypeScript matches Rust registry
        run: make check-codegen

      - name: Ownership and required-test guardrails
        run: |
          python3 scripts/test-code-ownership.py
          python3 scripts/check-code-ownership.py
          python3 scripts/test-required-cargo-tests.py

      - name: api-server reducer contract tests
        run: python3 scripts/run-required-cargo-tests.py --locked -p api-server --lib commands::tests

      - name: ai-gateway unit tests
        run: cargo test --locked -p ai-gateway --bin gateway

  contracts-drift:
    name: Contracts drift
    needs: scope
    if: needs.scope.outputs.run_contracts == 'true'
    runs-on: ubuntu-latest
    env:
      # Must match the module crate used for authoritative schema extraction.
      # Rust/TS client pins move atomically with the next contracts release.
      SPACETIME_CLI_VERSION: "2.8.2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/setup-contracts-ssh
        with:
          deploy-key: ${{ secrets.LUMIERE_CONTRACTS_DEPLOY_KEY }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spacetimedb
            .
          cache-on-failure: true

      - uses: ./.github/actions/setup-spacetime-cli
        with:
          version: ${{ env.SPACETIME_CLI_VERSION }}

      # Fails when the live SpacetimeDB module schema has changed but nobody
      # ran `make publish-contracts` to release the corresponding
      # lumiere-contracts tag — the drift check make check-codegen alone
      # can't catch, since check-codegen only compares against whatever
      # bindings are already in .contracts-staging/. See
      # docs/plans/contracts-extraction-execution-plan.md.
      - name: Verify STDB module matches pinned lumiere-contracts release
        run: make check-contracts-drift

  frontend:
    name: Frontend
    needs: scope
    if: needs.scope.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-contracts-ssh
        with:
          deploy-key: ${{ secrets.LUMIERE_CONTRACTS_DEPLOY_KEY }}

      - uses: ./.github/actions/setup-frontend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend build-cache graph
        run: node ../scripts/test-frontend-build-cache.mjs

      - name: Check accounting double-cast rationales
        run: bash ../scripts/lint-accounting-as-unknown-as.sh

      - name: Opaque record type-debt ratchet
        run: pnpm type-debt:check

      - name: Enforce immutable browser operation transport
        run: pnpm operation-transport:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Playwright tests load
        working-directory: frontend/web
        run: pnpm exec playwright test --list

      - name: Enforce mobile API boundary
        run: pnpm --filter mobile lint

      - name: Unit tests (erp-shared)
        run: pnpm --dir packages/erp-shared test

      - name: Unit tests (query-hooks params)
        run: pnpm --dir packages/query-hooks test

      - name: Unit tests (ui)
        run: pnpm --dir packages/ui test

      - name: Unit tests (web BFF helpers)
        run: pnpm --dir web test:unit

  owner-report-pdf:
    name: Owner-report PDF structural regression
    needs: scope
    if: needs.scope.outputs.run_pdf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Chromium renderer image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ./chromium-worker
          tags: lumiere-chromium-worker
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start trusted Chromium renderer
        run: docker run -d --name chromium-worker -p 8090:8090 lumiere-chromium-worker
      - name: Validate Chromium readiness helper
        run: node --test chromium-worker/src/readiness.test.mjs
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate deterministic report fixtures
        run: PDF_STRUCTURAL_OUTPUT="$GITHUB_WORKSPACE/artifacts/owner-report-pdf" node chromium-worker/scripts/structural-pdf-check.mjs
      - name: Capture renderer logs on failure
        if: failure()
        run: docker logs chromium-worker
      - name: Upload PDF diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owner-report-pdf-diagnostics
          path: artifacts/owner-report-pdf/
          retention-days: 7

  # Retain the historical check name for branch protection. The actual
  # Playwright compile/list validation now runs in the frontend job.
  playwright-compile:
    name: Playwright (compile smoke)
    if: always()
    needs: [scope, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility check
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.scope.outputs.valid }}" = true
          case "${{ needs.scope.outputs.run_frontend }}:${{ needs.frontend.result }}" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac

  gate:
    name: CI gate
    if: always()
    needs: [scope, stdb-check, rust, contracts-drift, frontend, owner-report-pdf, playwright-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require scope and scheduled validations to pass
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.scope.outputs.valid }}" = true
          for pair in \
            "run_contracts:${{ needs.scope.outputs.run_contracts }}:${{ needs.stdb-check.result }}" \
            "run_rust:${{ needs.scope.outputs.run_rust }}:${{ needs.rust.result }}" \
            "run_contracts:${{ needs.scope.outputs.run_contracts }}:${{ needs.contracts-drift.result }}" \
            "run_frontend:${{ needs.scope.outputs.run_frontend }}:${{ needs.frontend.result }}" \
            "run_pdf:${{ needs.scope.outputs.run_pdf }}:${{ needs.owner-report-pdf.result }}"; do
            IFS=: read -r name expected actual <<< "$pair"
            case "$expected:$actual" in
              true:success|false:skipped) ;;
              *) echo "Unexpected result for $name: $expected:$actual"; exit 1 ;;
            esac
          done
          test "${{ needs.playwright-compile.result }}" = success
