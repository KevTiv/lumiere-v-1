name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spacetimedb
            .

      - name: SpacetimeDB module (cargo check --tests)
        working-directory: spacetimedb
        run: cargo check --tests

      - name: Workspace members (api-server, ai-gateway, lumiere-codegen, stdb-auth)
        run: cargo check -p api-server -p ai-gateway -p lumiere-codegen -p stdb-auth

      - name: lumiere-codegen unit tests
        run: cargo test -p lumiere-codegen

      - name: Verify generated TypeScript matches Rust registry
        run: make check-codegen

      - name: api-server unit tests
        run: cargo test -p api-server reducer_allowlist

      - name: ai-gateway unit tests
        run: cargo test -p ai-gateway health_returns

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (erp-shared)
        run: pnpm --dir packages/erp-shared test

      - name: Unit tests (query-hooks params)
        run: pnpm --dir packages/query-hooks test

      - name: Unit tests (ui)
        run: pnpm --dir packages/ui test

      - name: Unit tests (web BFF helpers)
        run: pnpm --dir web test:unit

  playwright-compile:
    name: Playwright (compile smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Playwright tests load
        working-directory: frontend/web
        run: pnpm exec playwright test --list

  owner-report-pdf:
    name: Owner-report PDF structural regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start trusted Chromium renderer
        run: docker build -t lumiere-chromium-worker ./chromium-worker && docker run -d --name chromium-worker -p 8090:8090 lumiere-chromium-worker
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate deterministic report fixtures
        run: PDF_STRUCTURAL_OUTPUT="$GITHUB_WORKSPACE/artifacts/owner-report-pdf" node chromium-worker/scripts/structural-pdf-check.mjs
      - name: Capture renderer logs on failure
        if: failure()
        run: docker logs chromium-worker
      - name: Upload PDF diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: owner-report-pdf-diagnostics
          path: artifacts/owner-report-pdf
