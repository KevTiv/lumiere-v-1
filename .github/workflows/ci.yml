name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spacetimedb
            .

      - name: SpacetimeDB module (cargo check --tests)
        working-directory: spacetimedb
        run: cargo check --tests

      - name: Workspace members (api-server, ai-gateway)
        run: cargo check -p api-server -p ai-gateway

      - name: api-server unit tests
        run: cargo test -p api-server reducer_allowlist

      - name: ai-gateway unit tests
        run: cargo test -p ai-gateway health_returns

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (erp-shared)
        run: pnpm --dir packages/erp-shared test

      - name: Unit tests (query-hooks params)
        run: pnpm --dir packages/query-hooks test

      - name: Unit tests (ui)
        run: pnpm --dir packages/ui test

      - name: Unit tests (web BFF helpers)
        run: pnpm --dir web test:unit

  playwright-compile:
    name: Playwright (compile smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Playwright tests load
        working-directory: frontend/web
        run: pnpm exec playwright test --list
