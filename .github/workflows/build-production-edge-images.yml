name: Build production edge images

on:
  push:
    branches: [codex/railway-production-completion]
    paths:
      - frontend/**
      - infra/kong/**
      - scripts/tests/test_kong*.py
      - docker-compose.yml
      - chromium-worker/**
      - .dockerignore
      - .github/workflows/build-production-edge-images.yml
  pull_request:
    paths:
      - frontend/**
      - infra/kong/**
      - scripts/tests/test_kong*.py
      - docker-compose.yml
      - chromium-worker/**
      - .dockerignore
      - .github/workflows/build-production-edge-images.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: Exact main revision selected by the stack release
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-edge-${{ github.workflow }}-${{ inputs.release_sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: frontend
            dockerfile: frontend/web/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: infra/kong/Dockerfile
          - service: chromium-worker
            context: chromium-worker
            dockerfile: chromium-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Validate pinned frontend contracts
        if: matrix.service == 'web'
        run: |
          node frontend/scripts/verify-vendored-contracts.mjs
          python3 scripts/tests/test_railway_stack_workflow.py -v
          node --experimental-vm-modules --test scripts/tests/alpha-demo-seed.test.mjs
          node --experimental-strip-types --test frontend/web/lib/demo-access-policy.test.mjs
      - name: Validate gateway configuration rendering
        if: matrix.service == 'api-gateway'
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          sh infra/kong/test-render-config.sh
          python3 scripts/tests/test_kong_private_release.py -v
          python3 scripts/tests/test_kong_postgres.py
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:$IMAGE_SHA" >> "$GITHUB_OUTPUT"
      - name: Preserve existing commit image
        id: existing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          if manifest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2>/dev/null)"; then
            digest="$(jq -er '.digest' <<<"$manifest")"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing immutable image $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build image
        if: steps.existing.outputs.digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_STDB_MODULE=lumiere-v1
            NEXT_PUBLIC_API_GATEWAY_URL=
            NEXT_PUBLIC_REALTIME_WS_URL=wss://api-gateway-production-d680.up.railway.app/v1/realtime/ws
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=production-${{ matrix.service }}
          cache-to: type=gha,scope=production-${{ matrix.service }},mode=max
          provenance: mode=max
          sbom: true
      - name: Publish deployment coordinate
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          task_docker_config="$(mktemp -d)"
          DOCKER_CONFIG="$task_docker_config" docker manifest inspect "$IMAGE" >/dev/null
          echo "${{ matrix.service }}: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
