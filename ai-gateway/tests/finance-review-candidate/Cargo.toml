[package]
name = "finance-review-candidate-checks"
version = "0.0.0"
edition = "2021"
publish = false

# Provider-free contract checks also run when unrelated application dependencies
# are unavailable. Compile the same source and actual API owner calculations.
[workspace]

[[test]]
name = "finance_review_contract"
path = "../finance_review_contract.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
