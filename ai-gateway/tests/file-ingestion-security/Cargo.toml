[package]
name = "file-ingestion-security-checks"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the production resolver, context serializer and intelligence contracts
# without generating the unrelated ERP SDK bindings. Network/store transports are
# unavailable stand-ins; the actual source module's fake-authority tests run.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
lumiere-file-inspection = { path = "../../../crates/file-inspection" }
