_format_version: "3.0"
_transform: true

services:
  # Serve crawler instructions without waking Next.js or contacting a backend.
  - name: robots
    url: http://127.0.0.1:1
    routes:
      - name: robots
        paths: ['~/robots\.txt$']
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: text/plain
          body: "User-agent: *\nDisallow: /\n"

  # This is a private ERP, not a CMS. Reject scanner probes at the gateway.
  - name: scanner-reject
    url: http://127.0.0.1:1
    routes:
      - name: scanner-reject
        paths: ['/.git', '/.env', '/wp-admin', '/wp-login.php', '/xmlrpc.php']
    plugins:
      - name: request-termination
        config:
          status_code: 404
          content_type: application/json
          body: '{"error":"Not found"}'

  # Disabled features must not proxy to paid external ingestion or AI services.
  - name: disabled-ingestion
    url: http://127.0.0.1:1
    routes:
      - name: disabled-ingestion
        paths: ['/ingest', '/_vercel/insights']
    plugins:
      - name: request-termination
        config:
          status_code: 404
          content_type: application/json
          body: '{"error":"Analytics ingestion is disabled"}'

  # Railway probes this gateway-owned route. The request-termination plugin
  # answers before proxying, so readiness never depends on web being deployed.
  - name: gateway-health
    url: http://127.0.0.1:1
    routes:
      - name: gateway-health
        paths:
          - /health/ready
          - /health
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: application/json
          body: '{"status":"ok","service":"api-gateway"}'

  - name: web
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__
    routes:
      - name: web-root
        paths:
          - /
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 600
          hour: 6000
          limit_by: ip
          fault_tolerant: false
          policy: cluster
      - name: request-size-limiting
        config:
          allowed_payload_size: 20

  - name: api-query
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/query
    routes:
      - name: api-query
        paths:
          - /api/query
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 240
          hour: 3000
          limit_by: ip
          fault_tolerant: false
          policy: cluster

  - name: api-history
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/history
    routes:
      - name: api-history
        methods: [GET]
        paths:
          - /api/history
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 240
          hour: 3000
          limit_by: ip
          fault_tolerant: false
          policy: cluster

  - name: api-call
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/call
    routes:
      - name: api-call
        paths:
          - /api/call
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 90
          hour: 1000
          limit_by: ip
          fault_tolerant: false
          policy: cluster
      - name: request-size-limiting
        config:
          allowed_payload_size: 20

  - name: api-stdb
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/stdb
    routes:
      - name: api-stdb
        paths:
          - /api/stdb
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 240
          hour: 3000
          limit_by: ip
          fault_tolerant: false
          policy: cluster
      - name: request-size-limiting
        config:
          allowed_payload_size: 32

  - name: api-auth-signin
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/auth/signin
    routes:
      - name: api-auth-signin
        paths:
          - /api/auth/signin
        strip_path: true
    plugins: &auth_plugins
      - name: rate-limiting
        config:
          minute: 10
          hour: 100
          limit_by: ip
          fault_tolerant: false
          policy: cluster

  - name: api-auth-signup
    url: http://127.0.0.1:1
    routes:
      - name: api-auth-signup
        paths: ['/api/auth/signup']
        strip_path: true
    plugins:
      - name: request-termination
        config:
          status_code: 403
          content_type: application/json
          body: '{"error":"This initial release is invite-only. Contact your administrator."}'

  - name: api-auth-invite
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/auth/invite
    routes:
      - name: api-auth-invite
        paths:
          - /api/auth/invite
        strip_path: true
    plugins: *auth_plugins

  - name: api-auth-accept-invite
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/auth/accept-invite
    routes:
      - name: api-auth-accept-invite
        paths:
          - /api/auth/accept-invite
        strip_path: true
    plugins: *auth_plugins

  - name: api-auth-forgot-password
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/auth/forgot-password
    routes:
      - name: api-auth-forgot-password
        paths:
          - /api/auth/forgot-password
        strip_path: true
    plugins: *auth_plugins

  - name: api-auth-reset-password
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/auth/reset-password
    routes:
      - name: api-auth-reset-password
        paths:
          - /api/auth/reset-password
        strip_path: true
    plugins: *auth_plugins

  - name: api-crm
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/crm
    routes:
      - name: api-crm
        paths:
          - /api/crm
        strip_path: true
    plugins: &domain_plugins
      - name: rate-limiting
        config:
          minute: 180
          hour: 2000
          limit_by: ip
          fault_tolerant: false
          policy: cluster
      - name: request-size-limiting
        config:
          allowed_payload_size: 20

  - name: api-sales
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/sales
    routes:
      - name: api-sales
        paths:
          - /api/sales
        strip_path: true
    plugins: *domain_plugins

  - name: api-accounting
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/accounting
    routes:
      - name: api-accounting
        paths:
          - /api/accounting
        strip_path: true
    plugins: *domain_plugins

  - name: api-inventory
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/inventory
    routes:
      - name: api-inventory
        paths:
          - /api/inventory
        strip_path: true
    plugins: *domain_plugins

  - name: api-settings
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/settings
    routes:
      - name: api-settings
        paths:
          - /api/settings
        strip_path: true
    plugins: *domain_plugins

  - name: api-proposals
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/proposals
    routes:
      - name: api-proposals
        paths:
          - /api/proposals
        strip_path: true
    plugins: *domain_plugins

  # Generic ERP commands are Rust-owned. Route them here rather than relying on
  # Next.js build-time rewrites, which may be absent in a standalone image.
  - name: api-operations
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/operations
    routes:
      - name: api-operations
        paths:
          - /api/operations
        strip_path: true
    plugins: *domain_plugins

  - name: api-compat-reducer
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__/api/compat/reducer
    routes:
      - name: api-compat-reducer
        paths:
          - /api/compat/reducer
        strip_path: true
    plugins: *domain_plugins

  - name: api-realtime
    url: http://__API_SERVER_UPSTREAM_HOST__:__API_SERVER_UPSTREAM_PORT__/v1/realtime
    routes:
      - name: api-realtime
        paths:
          - /v1/realtime
        strip_path: true
        protocols:
          - http
          - https
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          hour: 1500
          limit_by: ip
          fault_tolerant: false
          policy: cluster

  # Approved Alpha report pilot only. Web still enforces its AI switch, session,
  # company scope, certified release, capability grants and spend admission.
  # Exact paths and methods keep every other AI endpoint on the 503 route.
  - name: web-ai-alpha-pilot
    url: http://__WEB_UPSTREAM_HOST__:__WEB_UPSTREAM_PORT__
    routes:
      - name: web-ai-alpha-certification-read
        paths:
          - '~/api/ai/skills/certifications(?:/[1-9][0-9]*)?$'
        methods: [GET]
        regex_priority: 10
        strip_path: false
      - name: web-ai-alpha-report-and-inspect
        paths:
          - '~/api/ai/skills/report-analysis$'
          - '~/api/ai/evidence/runs/inspect$'
        methods: [POST]
        regex_priority: 10
        strip_path: false
    plugins: *domain_plugins

  - name: web-ai
    url: http://127.0.0.1:1
    routes:
      - name: web-ai
        paths:
          - /api/ai
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 503
          content_type: application/json
          body: '{"error":"AI is disabled for the initial release"}'

plugins:
  - name: response-transformer
    config:
      add:
        headers:
          - 'X-Robots-Tag:noindex, nofollow, noarchive'
  - name: cors
    config:
      origins:
        - '__CORS_ORIGIN__'
      credentials: true
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Accept-Language
        - Authorization
        - Content-Type
        - Cookie
        - X-Stdb-Identity
      exposed_headers:
        - RateLimit-Limit
        - RateLimit-Remaining
        - RateLimit-Reset
      max_age: 3600
