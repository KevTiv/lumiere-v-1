services:
  kong:
    image: kong:3.9
    depends_on:
      - redis
      - web
      - api-server
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    depends_on:
      - api-server
      - ai-gateway
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8000}
      LUMIERE_API_SERVER_URL: http://api-server:8082
      LUMIERE_AI_GATEWAY_URL: http://ai-gateway:8080
      LUMIERE_AI_GATEWAY_INTERNAL_SECRET: ${LUMIERE_AI_GATEWAY_INTERNAL_SECRET:?set LUMIERE_AI_GATEWAY_INTERNAL_SECRET}
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      NEXT_PUBLIC_STDB_MODULE: ${NEXT_PUBLIC_STDB_MODULE:-}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    expose:
      - "3000"
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BIN: api-server
    depends_on:
      - chromium-worker
    environment:
      PORT: 8082
      NODE_ENV: production
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      NEXT_PUBLIC_STDB_MODULE: ${NEXT_PUBLIC_STDB_MODULE:-}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN}
      AI_GATEWAY_URL: http://ai-gateway:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8000}
      LUMIERE_AI_GATEWAY_INTERNAL_SECRET: ${LUMIERE_AI_GATEWAY_INTERNAL_SECRET:?set LUMIERE_AI_GATEWAY_INTERNAL_SECRET}
      STDB_CREDENTIAL_ENCRYPTION_KEY: ${STDB_CREDENTIAL_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@lumiere-erp.com}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      LUMIERE_REPORT_RENDERER_URL: http://chromium-worker:8090
      LUMIERE_REPORT_ARTIFACT_DIR: /var/lib/lumiere/owner-reports
      # Cold-tier storage (docs/plans/sliding-window-cold-tier.md). Optional: if
      # unset, audit-log reads fall back to hot-only (see cold_tier::pg_pool).
      # Point at the managed Postgres instance once provisioned; PG_TLS_MODE
      # must be "require" here since NODE_ENV=production fails closed otherwise.
      PG_HOST: ${PG_HOST:-}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-lumiere}
      PG_USER: ${PG_USER:-lumiere}
      PG_PASSWORD: ${PG_PASSWORD:-}
      PG_TLS_MODE: ${PG_TLS_MODE:-require}
    volumes:
      - owner-report-artifacts:/var/lib/lumiere/owner-reports
    expose:
      - "8082"
    restart: unless-stopped

  chromium-worker:
    build:
      context: ./chromium-worker
    environment:
      PORT: 8090
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    expose:
      - "8090"
    restart: unless-stopped

  owner-report-worker:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BIN: owner-report-worker
    depends_on:
      - chromium-worker
    environment:
      NODE_ENV: production
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN}
      AI_GATEWAY_URL: http://ai-gateway:8080
      LUMIERE_REPORT_RENDERER_URL: http://chromium-worker:8090
      LUMIERE_REPORT_ARTIFACT_DIR: /var/lib/lumiere/owner-reports
      LUMIERE_OWNER_REPORT_WORKER_POLL_SECS: ${LUMIERE_OWNER_REPORT_WORKER_POLL_SECS:-15}
      LUMIERE_OWNER_REPORT_WORKER_NAME: ${LUMIERE_OWNER_REPORT_WORKER_NAME:-owner-report-worker-v1}
      LUMIERE_OWNER_REPORT_WORKER_PORT: 8091
    volumes:
      - owner-report-artifacts:/var/lib/lumiere/owner-reports
    expose:
      - "8091"
    restart: unless-stopped

  workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BIN: workflow-worker
    environment:
      NODE_ENV: production
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN}
      LUMIERE_WORKFLOW_WORKER_POLL_SECS: ${LUMIERE_WORKFLOW_WORKER_POLL_SECS:-15}
      LUMIERE_WORKFLOW_WORKER_NAME: ${LUMIERE_WORKFLOW_WORKER_NAME:-workflow-worker-v1}
      LUMIERE_WORKFLOW_WORKER_PORT: 8093
      LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ENABLED: ${LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ENABLED:-false}
      LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_COMPANY_IDS: ${LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_COMPANY_IDS:-}
      LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ACTION_KEYS: ${LUMIERE_WORKFLOW_EXTERNAL_DISPATCH_ACTION_KEYS:-}
      LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_URL: ${LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_URL:-}
      LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_TIMEOUT_MS: ${LUMIERE_WORKFLOW_EXTERNAL_WEBHOOK_TIMEOUT_MS:-10000}
    expose:
      - "8093"
    restart: unless-stopped

  audit-cold-drainer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BIN: audit-cold-drainer
    environment:
      NODE_ENV: production
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN}
      # This service's only job is draining to Postgres, so PG here is
      # required (not optional the way it is for api-server) — fails closed
      # rather than idling silently with nothing to do.
      PG_HOST: ${PG_HOST:?set PG_HOST}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-lumiere}
      PG_USER: ${PG_USER:-lumiere}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      PG_TLS_MODE: ${PG_TLS_MODE:-require}
      LUMIERE_AUDIT_DRAINER_POLL_SECS: ${LUMIERE_AUDIT_DRAINER_POLL_SECS:-5}
      LUMIERE_AUDIT_DRAINER_BATCH: ${LUMIERE_AUDIT_DRAINER_BATCH:-200}
      LUMIERE_AUDIT_DRAINER_PORT: 8094
    expose:
      - "8094"
    restart: unless-stopped

  pos-order-cold-drainer:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BIN: pos-order-cold-drainer
    environment:
      NODE_ENV: production
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      STDB_SERVER_TOKEN: ${STDB_SERVER_TOKEN:?set STDB_SERVER_TOKEN}
      # Same reasoning as audit-cold-drainer: PG is this service's only job.
      PG_HOST: ${PG_HOST:?set PG_HOST}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-lumiere}
      PG_USER: ${PG_USER:-lumiere}
      PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      PG_TLS_MODE: ${PG_TLS_MODE:-require}
      LUMIERE_POS_ORDER_DRAINER_POLL_SECS: ${LUMIERE_POS_ORDER_DRAINER_POLL_SECS:-5}
      LUMIERE_POS_ORDER_DRAINER_BATCH: ${LUMIERE_POS_ORDER_DRAINER_BATCH:-200}
      LUMIERE_POS_ORDER_DRAINER_PORT: 8095
    expose:
      - "8095"
    restart: unless-stopped

  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        BIN: gateway
    depends_on:
      - qdrant
    environment:
      PORT: 8080
      LUMIERE_AI_GATEWAY_INTERNAL_SECRET: ${LUMIERE_AI_GATEWAY_INTERNAL_SECRET:?set LUMIERE_AI_GATEWAY_INTERNAL_SECRET}
      QDRANT_URL: http://qdrant:6334
      QDRANT_ACTIVITY_REFS_COLLECTION: ${QDRANT_ACTIVITY_REFS_COLLECTION:-lumiere_erp_activity_refs_v1}
      STDB_HOST: ${STDB_HOST:-https://maincloud.spacetimedb.com}
      LUMIERE_API_SERVER_URL: http://api-server:8082
      STDB_MODULE: ${STDB_MODULE:?set STDB_MODULE}
      STDB_TOKEN: ${STDB_TOKEN:?set STDB_TOKEN}
      AI_CERTIFICATION_STDB_TOKEN: ${AI_CERTIFICATION_STDB_TOKEN:?set dedicated AI_CERTIFICATION_STDB_TOKEN}
      AI_CERTIFICATION_RUNTIME_HASH: ${AI_CERTIFICATION_RUNTIME_HASH:?set AI_CERTIFICATION_RUNTIME_HASH}
      AI_CERTIFICATION_POLL_SECS: ${AI_CERTIFICATION_POLL_SECS:-5}
      AI_CERTIFICATION_BATCH_SIZE: ${AI_CERTIFICATION_BATCH_SIZE:-10}
      AI_CERTIFICATION_TIMEOUT_SECS: ${AI_CERTIFICATION_TIMEOUT_SECS:-30}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2}
      UNSTRUCTURED_URL: ${UNSTRUCTURED_URL:-http://host.docker.internal:8000}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KONG_LLM_URL: ${KONG_LLM_URL:-}
      KONG_LLM_SERVICE_TOKEN: ${KONG_LLM_SERVICE_TOKEN:-}
    expose:
      - "8080"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
  owner-report-artifacts:
