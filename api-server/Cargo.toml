[package]
name = "api-server"
version.workspace = true
edition.workspace = true
description = "Axum API replacing Next.js /api routes (Phase 0–1)"
build = "build.rs"
default-run = "api-server"

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/main.rs"

[[bin]]
name = "expense-integration-worker"
path = "src/bin/expense-integration-worker.rs"

[[bin]]
name = "project-integration-worker"
path = "src/bin/project-integration-worker.rs"

[[bin]]
name = "hr-integration-worker"
path = "src/bin/hr-integration-worker.rs"

[[bin]]
name = "workflow-worker"
path = "src/bin/workflow-worker.rs"

[[bin]]
name = "projection-worker"
path = "src/bin/projection-worker.rs"

[[bin]]
name = "storage-migrate"
path = "src/bin/storage-migrate.rs"

[[bin]]
name = "reconstruct-organization"
path = "src/bin/reconstruct-organization.rs"

[dependencies]
lumiere-presentation-core.workspace = true
lumiere-contracts = { workspace = true, features = ["bindings"] }
anyhow.workspace = true
ammonia = "4.2.3"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
aes-gcm.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
bcrypt.workspace = true
jsonwebtoken = "9.3"
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cookie = "0.18"
base64.workspace = true
dotenvy.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
s3 = { package = "rust-s3", version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
stdb-config.workspace = true
stdb-auth.workspace = true
stdb-client.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tower-cookies = "0.10"
tower-http.workspace = true
printpdf = "0.7"
rust_xlsxwriter = "0.79"
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding = "2"
futures-util = "0.3"
# Must match `spacetimedb` in `spacetimedb/Cargo.toml` and the `spacetime` CLI used for `spacetime generate`.
# Do not use bare "2.0.1" — Cargo will pick 2.1.x and break generated client bindings.
spacetimedb-sdk = "2.0.1"
spacetimedb-sats = "=2.8.2"

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
base64.workspace = true
openssl = "=0.10.76"
tokio.workspace = true
tower.workspace = true

[build-dependencies]
serde_json = "1"
