[package]
name = "api-server"
version.workspace = true
edition.workspace = true
description = "Axum API replacing Next.js /api routes (Phase 0–1)"
build = "build.rs"

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aes-gcm.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
bcrypt.workspace = true
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
cookie = "0.18"
base64.workspace = true
dotenvy.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
stdb-config.workspace = true
stdb-auth.workspace = true
stdb-client.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-cookies = "0.10"
tower-http.workspace = true
printpdf = "0.7"
rust_xlsxwriter = "0.79"
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding = "2"
futures-util = "0.3"
# Must match `spacetimedb` in `spacetimedb/Cargo.toml` and the `spacetime` CLI used for `spacetime generate`.
# Do not use bare "2.0.1" — Cargo will pick 2.1.x and break generated client bindings.
spacetimedb-sdk = "2.0.1"

[dev-dependencies]
base64.workspace = true
tokio.workspace = true

[build-dependencies]
serde_json = "1"
